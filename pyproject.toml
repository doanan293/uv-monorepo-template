# Virtual uv workspace root: one uv.lock and one .venv for every service.
# Run `uv sync` here; inside a service use `uv run`.
[tool.uv.workspace]
members = ["services/*"]

[tool.uv]
required-version = ">=0.12"

# Development tools shared by every service, pinned once.
[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pyrefly==1.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.7",
]

# Shared Ruff configuration for every service in this repository.
# Services extend it from their pyproject.toml and only set `src`.
target-version = "py312"
line-length = 88

[lint]
select = ["E", "W", "F", "I", "B", "C4", "C90", "UP", "SIM", "RUF", "D", "PLR0915"]
# E501: line length is owned by the formatter.
# D100, D104: module and package docstrings are optional; functions, methods
# and classes still require Google-style docstrings.
ignore = ["E501", "D100", "D104"]

[lint.per-file-ignores]
# Test names describe the behavior; docstrings are not required in tests.
"**/tests/**" = ["D"]

# Function size: complexity and statement count stand in for the
# "split long functions" rule in docs/engineering-guide.md.
[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 40

[lint.pydocstyle]
convention = "google"

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[format]
docstring-code-format = true
